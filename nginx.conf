server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 정적 리소스 캐시 (파일명 해시 기준)
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA 라우팅
  location / { try_files $uri /index.html; }
}